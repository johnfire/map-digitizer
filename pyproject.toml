[project]
name = "map-digitizer"
version = "0.1.0"
description = "Turn scanned historical maps into a graph of places and connections with real geography underneath"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
    "scikit-image==0.26.0",
    "scipy>=1.14",
    "rasterio>=1.4",
    "osmium>=4.0",
    "pyproj>=3.7",
]

[project.scripts]
map-digitizer = "map_digitizer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/map_digitizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
